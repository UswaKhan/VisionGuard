<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VisionGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1f2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: auto;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animated .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(67, 97, 238, 0.08);
            animation: float 20s infinite ease-in-out;
        }

        .bg-animated .circle:nth-child(1) {
            width: 400px; height: 400px;
            top: -100px; left: -100px;
            animation-duration: 25s;
        }

        .bg-animated .circle:nth-child(2) {
            width: 300px; height: 300px;
            top: 50%; right: -80px;
            animation-delay: -5s;
            animation-duration: 20s;
        }

        .bg-animated .circle:nth-child(3) {
            width: 500px; height: 500px;
            bottom: -150px; left: 30%;
            animation-delay: -10s;
            animation-duration: 30s;
        }

        .bg-animated .circle:nth-child(4) {
            width: 200px; height: 200px;
            top: 30%; left: 60%;
            animation-delay: -7s;
            animation-duration: 22s;
            background: rgba(67, 97, 238, 0.05);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -50px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(50px, 30px) scale(1.02); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            margin: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 20px;
                border-radius: 16px;
            }

            .login-logo .shield-icon {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }

            .login-logo .shield-icon i {
                font-size: 24px;
            }

            .login-logo h1 {
                font-size: 22px;
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo .shield-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(67, 97, 238, 0.35);
        }

        .login-logo .shield-icon i {
            font-size: 32px;
            color: #fff;
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .login-logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-floating .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            height: 56px;
            padding: 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-floating .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #4361ee;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.25);
            color: #fff;
        }

        .form-floating label {
            color: rgba(255, 255, 255, 0.5);
            padding: 16px;
        }

        .form-floating .form-control:focus ~ label,
        .form-floating .form-control:not(:placeholder-shown) ~ label {
            color: rgba(255, 255, 255, 0.7);
            background: transparent;
        }

        .form-floating > label {
            background: transparent !important;
        }

        .form-floating > .form-control:focus ~ label::after,
        .form-floating > .form-control:not(:placeholder-shown) ~ label::after {
            background: transparent !important;
        }

        .form-floating .form-control:-webkit-autofill,
        .form-floating .form-control:-webkit-autofill:hover,
        .form-floating .form-control:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px rgba(26, 31, 46, 0.95) inset !important;
            -webkit-text-fill-color: #fff !important;
            transition: background-color 5000s ease-in-out 0s;
            border-color: #4361ee;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(67, 97, 238, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-flash {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b7a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="bg-animated">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="login-card">
        <div class="login-logo">
            <div class="shield-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>VisionGuard</h1>
            <p>AI-Based Monitoring System</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert-flash">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-floating">
                <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                <label for="email"><i class="fas fa-envelope me-2"></i>Email Address</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>
    </div>
</body>
</html>
