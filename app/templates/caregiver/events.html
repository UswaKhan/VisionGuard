{% extends "caregiver/base.html" %}

{% block title %}Events - VisionGuard{% endblock %}

{% block content %}
<h1>Events</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    {% for event in events %}
    <div class="card">
        <img src="{{ event.image_path }}" alt="{{ event.event_type }}" style="width: 100%;">
        <p><strong>{{ event.event_type }}</strong></p>
        <p>{{ event.created_at }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
