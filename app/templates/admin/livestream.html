{% extends "base.html" %}

{% block title %}Live Stream - VisionGuard{% endblock %}

{% block content %}
<h1>Live Stream</h1>

<div style="margin: 20px 0;">
    <button class="btn" onclick="startStream()">Start Stream</button>
    <button class="btn" onclick="stopStream()">Stop Stream</button>
</div>

<div id="status" style="margin: 10px 0;">
    <strong>Status:</strong> <span id="status-text">Stopped</span>
</div>

<div id="video-container" style="border: 1px solid #ddd; padding: 10px;">
    <img id="video-feed" style="width: 100%; max-width: 640px; display: none;" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script>
    const socket = io();
    const videoFeed = document.getElementById('video-feed');
    const statusText = document.getElementById('status-text');

    socket.on('video_frame', function(data) {
        videoFeed.src = 'data:image/jpeg;base64,' + data.frame;
        videoFeed.style.display = 'block';
    });

    function startStream() {
        fetch('/stream/start', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                statusText.textContent = 'Running';
            });
    }

    function stopStream() {
        fetch('/stream/stop', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                statusText.textContent = 'Stopped';
                videoFeed.style.display = 'none';
            });
    }
</script>
{% endblock %}
