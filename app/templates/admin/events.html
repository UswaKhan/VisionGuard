{% extends "base.html" %}

{% block title %}Events - VisionGuard{% endblock %}

{% block content %}
<h1>Events</h1>

<form method="POST" action="/admin/events/delete_all" style="margin: 20px 0;">
    <button type="submit" class="btn" onclick="return confirm('Delete all events?')">Delete All</button>
</form>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    {% for event in events %}
    <div class="card">
        <img src="{{ event.image_path }}" alt="{{ event.event_type }}" style="width: 100%;">
        <p><strong>{{ event.event_type }}</strong></p>
        <p>{{ event.created_at }}</p>
        <form method="POST" action="/admin/events/{{ event.id }}/delete">
            <button type="submit" class="btn">Delete</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
