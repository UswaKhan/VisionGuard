<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VisionGuard{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        nav { background: #333; padding: 10px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; }
        .btn { padding: 8px 15px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        img { max-width: 200px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/livestream">Live Stream</a>
        <a href="/admin/events">Events</a>
        <a href="/admin/alerts">Alerts</a>
        <a href="/admin/caregivers">Caregivers</a>
        <a href="/logout">Logout</a>
    </nav>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
